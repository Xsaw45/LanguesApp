<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Langues</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Langues">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; }
    main { width: 100%; max-width: 30rem; padding: max(2.5rem, env(safe-area-inset-top)) 1.25rem 2rem; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
    #user { margin: 0.25rem 0 2rem; color: #94a3b8; font-size: 0.9rem; min-height: 1.2em; }
    .card { display: flex; align-items: center; gap: 1rem; padding: 1.25rem; margin-bottom: 1rem; border-radius: 1rem;
      background: #1e293b; border: 1px solid #334155; color: inherit; text-decoration: none; transition: border-color .15s; }
    .card:hover, .card:focus-visible { border-color: #64748b; }
    .flag { flex: none; width: 3rem; height: 2rem; border-radius: 0.25rem; }
    .card strong { display: block; font-size: 1.2rem; }
    .card span { display: block; color: #94a3b8; font-size: 0.85rem; margin-top: 0.15rem; }
    .card small { display: block; color: #64748b; font-size: 0.75rem; margin-top: 0.35rem; }
    .card small.pending { color: #fbbf24; }
  </style>
</head>
<body>
  <main>
    <h1>Langues</h1>
    <p id="user"></p>
    <a class="card" href="/it/">
      <svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#f4f5f0"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>
      <div><strong>Italiano</strong><span>Grammaire, vocabulaire, conjugaison, traduction</span><small data-sync="it"></small></div>
    </a>
    <a class="card" href="/zh/">
      <svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#de2910"/><polygon fill="#ffde00" points="5,2 6.2,5.6 10,5.6 6.9,7.8 8.1,11.4 5,9.2 1.9,11.4 3.1,7.8 0,5.6 3.8,5.6"/><circle cx="10" cy="2" r="0.9" fill="#ffde00"/><circle cx="12" cy="4" r="0.9" fill="#ffde00"/><circle cx="12" cy="7" r="0.9" fill="#ffde00"/><circle cx="10" cy="9" r="0.9" fill="#ffde00"/></svg>
      <div><strong>中文</strong><span>Vocabulaire HSK 1–9</span><small data-sync="zh"></small></div>
    </a>
  </main>
  <script>
    fetch('/api/me')
      .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
      .then((me) => { document.getElementById('user').textContent = `Connecté : ${me.name} · progression synchronisée`; })
      .catch(() => { document.getElementById('user').textContent = 'Hors ligne : la progression sera synchronisée au retour du réseau'; });

    // Etat ecrit par shared/sync.js dans localStorage["langues-sync:<app>"]
    function ago(ms) {
      const min = Math.round((Date.now() - ms) / 60000);
      if (min < 1) return "à l'instant";
      if (min < 60) return `il y a ${min} min`;
      const h = Math.round(min / 60);
      return h < 48 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
    }
    for (const el of document.querySelectorAll('[data-sync]')) {
      let meta = null;
      try { meta = JSON.parse(localStorage.getItem(`langues-sync:${el.dataset.sync}`)); } catch {}
      const pending = meta ? Object.keys(meta.pending || {}).length : 0;
      if (pending) {
        el.textContent = `${pending} modification${pending > 1 ? 's' : ''} en attente d'envoi`;
        el.classList.add('pending');
      } else if (meta && meta.lastSync) {
        el.textContent = `Synchronisé ${ago(meta.lastSync)}`;
      }
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' });
  </script>
</body>
</html>
