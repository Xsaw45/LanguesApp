<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Connexion</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <meta name="theme-color" content="#141415">
  <!-- Connexion par e-mail de l'acces public (server/auth.js) : lien ou code a 6 chiffres. -->
  <style>
    :root { color-scheme: dark; font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #141415; color: #ededed; display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 26rem; padding: max(3.5rem, env(safe-area-inset-top)) 1.25rem 2rem; box-sizing: border-box; }
    .seal { width: 3rem; height: 3rem; border-radius: 0.75rem; background: #dc2626; color: #fff; display: grid; place-items: center;
      font-size: 1.6rem; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    h1 { margin: 1.5rem 0 0.5rem; font-size: 1.75rem; font-weight: 500; line-height: 1.2; }
    p { margin: 0; color: #a1a1a6; font-size: 1rem; line-height: 1.5; }
    form { margin-top: 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
    label { font-size: 0.875rem; color: #a1a1a6; }
    input { height: 3.25rem; padding: 0 1rem; border-radius: 0.75rem; border: 1px solid rgb(237 237 237 / 0.14); background: #19191b;
      color: #ededed; font: inherit; font-size: 1.0625rem; box-sizing: border-box; width: 100%; }
    input:focus { outline: 2px solid #ef4444; outline-offset: 1px; border-color: transparent; }
    input.code { font-size: 1.75rem; letter-spacing: 0.5em; text-align: center; font-variant-numeric: tabular-nums; }
    button { height: 3.25rem; border-radius: 0.75rem; border: 0; font: inherit; font-size: 1.0625rem; font-weight: 600; cursor: pointer;
      background: #dc2626; color: #fff; transition: background-color .15s; }
    button:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.link { height: auto; padding: 0.5rem 0; background: none; color: #a1a1a6; font-weight: 400; font-size: 0.9375rem; text-decoration: underline;
      text-underline-offset: 3px; text-decoration-color: rgb(237 237 237 / 0.14); }
    button.link:hover { color: #ededed; background: none; }
    .error { color: #e5484d; font-size: 0.9375rem; min-height: 1.4em; }
    .row { display: flex; justify-content: space-between; gap: 1rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="seal" aria-hidden="true">中</div>

    <section id="step-email">
      <h1 data-t="title"></h1>
      <p data-t="intro"></p>
      <form id="email-form">
        <label for="email" data-t="emailLabel"></label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required>
        <p class="error" id="email-error" role="alert"></p>
        <button type="submit" data-t="send"></button>
      </form>
    </section>

    <section id="step-code" hidden>
      <h1 data-t="checkTitle"></h1>
      <p id="sent-to"></p>
      <form id="code-form">
        <label for="code" data-t="codeLabel"></label>
        <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        <p class="error" id="code-error" role="alert"></p>
        <button type="submit" data-t="confirm"></button>
        <div class="row">
          <button type="button" class="link" id="change" data-t="change"></button>
          <button type="button" class="link" id="resend" data-t="resend"></button>
        </div>
      </form>
    </section>

    <section id="step-link" hidden>
      <h1 data-t="linkTitle"></h1>
      <p data-t="linkIntro"></p>
      <form id="link-form">
        <button type="submit" data-t="signIn"></button>
      </form>
    </section>
  </main>

  <script>
    const TEXT = {
      fr: {
        title: 'Connexion', intro: 'Saisis ton adresse e-mail : tu vas recevoir un lien et un code pour te connecter, sans mot de passe.',
        emailLabel: 'Adresse e-mail', send: 'Recevoir le code', checkTitle: 'Vérifie tes e-mails',
        sentTo: 'Un code a été envoyé à {email}. Ouvre le lien de l’e-mail, ou saisis le code ici.',
        codeLabel: 'Code à 6 chiffres', confirm: 'Valider', change: 'Changer d’adresse', resend: 'Renvoyer le code',
        resent: 'Nouveau code envoyé.',
        linkTitle: 'Connexion', linkIntro: 'Confirme pour te connecter sur cet appareil.', signIn: 'Me connecter',
        not_invited: 'Cette adresse n’est pas invitée au test. Vérifie l’orthographe ou demande une invitation.',
        too_soon: 'Un e-mail vient d’être envoyé : attends {s} s avant d’en demander un autre.',
        too_many: 'Trop de demandes pour cette adresse : réessaie dans une heure.',
        wrong_code: 'Code incorrect ({n} essai(s) restant(s)).',
        expired_code: 'Ce code a expiré ou a été trop souvent mal saisi : demande un nouveau code.',
        invalid_link: 'Ce lien a expiré ou a déjà servi : demande un nouveau code.',
        network: 'Pas de connexion au serveur : vérifie ton réseau et réessaie.',
        other: 'Une erreur est survenue : réessaie.',
      },
      en: {
        title: 'Sign in', intro: 'Enter your email address: you will receive a link and a code to sign in, no password needed.',
        emailLabel: 'Email address', send: 'Get the code', checkTitle: 'Check your email',
        sentTo: 'A code was sent to {email}. Open the link in the email, or enter the code here.',
        codeLabel: '6-digit code', confirm: 'Confirm', change: 'Change address', resend: 'Send a new code',
        resent: 'New code sent.',
        linkTitle: 'Sign in', linkIntro: 'Confirm to sign in on this device.', signIn: 'Sign in',
        not_invited: 'This address is not invited to the test. Check the spelling or ask for an invitation.',
        too_soon: 'An email was just sent: wait {s} s before asking for another one.',
        too_many: 'Too many requests for this address: try again in an hour.',
        wrong_code: 'Wrong code ({n} attempt(s) left).',
        expired_code: 'This code expired or was mistyped too often: ask for a new code.',
        invalid_link: 'This link expired or was already used: ask for a new code.',
        network: 'Cannot reach the server: check your network and try again.',
        other: 'Something went wrong: try again.',
      },
    };
    const lang = (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    const t = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = t[el.dataset.t];

    const params = new URLSearchParams(location.search);
    // Meme regle que le serveur (safeNext) : uniquement un chemin de ce site.
    const next = /^\/(?![/\\])[\w\-./]*$/.test(params.get('next') || '') ? params.get('next') : '/zh/';
    const $ = (id) => document.getElementById(id);
    let email = localStorage.getItem('langues-login-email') || '';
    $('email').value = email;

    function show(step) {
      for (const id of ['step-email', 'step-code', 'step-link']) $(id).hidden = id !== step;
      const input = document.querySelector(`#${step} input`);
      if (input) input.focus();
    }

    async function post(path, body) {
      let res;
      try {
        res = await fetch(`/api/auth/${path}`, {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
        });
      } catch {
        return { error: t.network };
      }
      const data = await res.json().catch(() => ({}));
      if (res.ok) return { data };
      const message = (t[data.error] || t.other)
        .replace('{s}', data.retryAfter ?? '').replace('{n}', data.attemptsLeft ?? 0);
      return { error: message };
    }

    async function withButton(form, action) {
      const button = form.querySelector('button[type=submit]');
      button.disabled = true;
      try { await action(); } finally { button.disabled = false; }
    }

    async function requestCode(errorEl) {
      const { error } = await post('request', { email, lang, next });
      errorEl.textContent = error || '';
      return !error;
    }

    $('email-form').addEventListener('submit', (event) => {
      event.preventDefault();
      withButton(event.target, async () => {
        email = $('email').value.trim();
        localStorage.setItem('langues-login-email', email);
        if (await requestCode($('email-error'))) {
          $('sent-to').textContent = t.sentTo.replace('{email}', email);
          $('code').value = '';
          $('code-error').textContent = '';
          show('step-code');
        }
      });
    });

    $('code-form').addEventListener('submit', (event) => {
      event.preventDefault();
      withButton(event.target, async () => {
        const { error } = await post('verify', { email, code: $('code').value.trim() });
        if (error) $('code-error').textContent = error;
        else location.replace(next);
      });
    });

    $('change').addEventListener('click', () => show('step-email'));
    $('resend').addEventListener('click', async () => {
      if (await requestCode($('code-error'))) $('code-error').textContent = t.resent;
    });

    // Lien de l'e-mail : la connexion attend un clic (les antivirus de messagerie ouvrent les liens tout seuls).
    const token = params.get('token');
    if (token) {
      history.replaceState(null, '', `/login/?next=${encodeURIComponent(next)}`);
      show('step-link');
      $('link-form').addEventListener('submit', (event) => {
        event.preventDefault();
        withButton(event.target, async () => {
          const { error } = await post('verify', { token });
          if (error) {
            show('step-email');
            $('email-error').textContent = error;
          } else location.replace(next);
        });
      });
    } else {
      show('step-email');
    }
  </script>
</body>
</html>
